services:
  - type: web
    name: xiaoxiao-garden
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GARDEN_DATA_DIR
        value: /var/data
      - key: GARDEN_COOKIE_SECURE
        value: "1"
    disk:
      name: garden-data
      mountPath: /var/data
      sizeGB: 1
