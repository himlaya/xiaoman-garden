services:
  - type: web
    name: xiaoxiao-garden
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GARDEN_SECRET_KEY
        generateValue: true
      - key: GARDEN_REQUIRE_CLOUD_DB
        value: "1"
      - key: GARDEN_COOKIE_SECURE
        value: "1"
