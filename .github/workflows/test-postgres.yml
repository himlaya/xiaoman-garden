name: Test PostgreSQL accounts and market

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'tests/test_server.py'
      - 'tools/migrate_to_postgres.py'
      - 'requirements*.txt'
      - '.github/workflows/test-postgres.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tests/test_server.py'
      - 'tools/migrate_to_postgres.py'
      - 'requirements*.txt'
      - '.github/workflows/test-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garden_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: garden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garden_test -d garden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GARDEN_TEST_DATABASE_URL: postgresql://garden_test:test_only_password@localhost:5432/garden_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-deploy.txt
      - run: python -m unittest discover -s tests -p test_server.py -v
