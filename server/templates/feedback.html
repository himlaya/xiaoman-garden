{% extends "base.html" %}
{% block title %}留言反馈 · 小小花园{% endblock %}
{% block content %}
  <h1>给花园留句话</h1>
  <p class="auth-lead">遇到的问题、想要的功能，都可以写在这里。反馈仅管理员可查看。</p>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="feedback">你的留言</label>
    <textarea id="feedback" name="content" rows="7" maxlength="2000" required>{{ content }}</textarea>
    <button class="auth-submit" type="submit">提交反馈</button>
  </form>
  <p class="auth-switch"><a href="{{ url_for('game') }}">返回花园</a></p>
{% endblock %}
